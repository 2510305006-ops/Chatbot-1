<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aman Detective Agency & Laboratory — Support Chat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f2f5;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 1rem;
  }
  #chat-wrap {
    display: flex; flex-direction: column;
    width: 100%; max-width: 480px;
    height: 620px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    background: #fff;
  }
  #chat-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: #0C447C;
    color: #fff;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .avatar i { font-size: 20px; color: #fff; }
  .header-info .name { font-size: 15px; font-weight: 500; }
  .header-info .status { font-size: 12px; opacity: 0.8; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    background: #f8f9fb;
  }
  .msg { display: flex; gap: 8px; max-width: 88%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .bubble {
    padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.55; color: #1a1a1a;
  }
  .msg.bot .bubble { background: #fff; border: 0.5px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: #0C447C; color: #fff; border-bottom-right-radius: 4px; }
  .bot-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: #0C447C; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; margin-top: 2px;
  }
  .bot-avatar i { font-size: 15px; color: #fff; }
  .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: #aaa;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
  #quick-btns {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 10px 16px; background: #fff;
    border-top: 0.5px solid #e8e8e8;
  }
  .qbtn {
    font-size: 12px; padding: 5px 11px;
    border: 0.5px solid #ccc; border-radius: 20px;
    background: #f5f5f5; color: #444; cursor: pointer;
    white-space: nowrap; transition: background 0.15s;
  }
  .qbtn:hover { background: #e8edf5; border-color: #0C447C; color: #0C447C; }
  #chat-input-row {
    display: flex; gap: 8px; padding: 12px 16px;
    background: #fff; border-top: 0.5px solid #e8e8e8;
  }
  #chat-input {
    flex: 1; font-size: 14px; padding: 9px 13px;
    border-radius: 24px; border: 1px solid #ddd;
    background: #f8f9fb; color: #1a1a1a; outline: none;
  }
  #chat-input:focus { border-color: #0C447C; background: #fff; }
  #send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: none; background: #0C447C; color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.15s;
  }
  #send-btn:hover { background: #185FA5; }
  #send-btn i { font-size: 17px; }
  @media (max-width: 500px) {
    body { padding: 0; align-items: flex-end; }
    #chat-wrap { max-width: 100%; border-radius: 16px 16px 0 0; height: 92vh; }
  }
</style>
</head>
<body>

<div id="chat-wrap">
  <div id="chat-header">
    <div class="avatar"><i class="ti ti-shield-search"></i></div>
    <div class="header-info">
      <div class="name">Aman Detective Agency & Laboratory</div>
      <div class="status"><span class="dot"></span> Online — replies instantly</div>
    </div>
  </div>

  <div id="messages">
    <div class="msg bot">
      <div class="bot-avatar"><i class="ti ti-shield-search"></i></div>
      <div class="bubble">
        👋 Welcome to <strong>Aman Detective Agency &amp; Laboratory</strong>!<br><br>
        I'm your virtual assistant. I can help you with information about our investigation services, lab tests, hiring a detective, and more.<br><br>
        How can I assist you today?
      </div>
    </div>
  </div>

  <div id="quick-btns">
    <button class="qbtn" onclick="sendQ('What services do you offer?')">Our services</button>
    <button class="qbtn" onclick="sendQ('How do I hire a detective?')">Hire a detective</button>
    <button class="qbtn" onclick="sendQ('What lab tests do you provide?')">Lab tests</button>
    <button class="qbtn" onclick="sendQ('What are your charges?')">Pricing</button>
    <button class="qbtn" onclick="sendQ('Is my case kept confidential?')">Confidentiality</button>
    <button class="qbtn" onclick="sendQ('How do I contact you?')">Contact us</button>
  </div>

  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Ask us anything..." aria-label="Type your message"
      onkeydown="if(event.key==='Enter') sendMsg()" />
    <button id="send-btn" onclick="sendMsg()" aria-label="Send">
      <i class="ti ti-send"></i>
    </button>
  </div>
</div>

<script>
const API_KEY = "YOUR_ANTHROPIC_API_KEY"; // Replace with your actual API key

const SYSTEM = `You are a professional, warm, and knowledgeable customer support assistant for "Aman Detective Agency and Laboratory" — a trusted private investigation and forensic laboratory firm. You speak clearly and reassuringly. Keep replies concise (2-5 sentences) unless more detail is needed.

SERVICES WE OFFER:

1. PRIVATE INVESTIGATION
   - Matrimonial investigations (pre/post-marriage verification, spouse surveillance)
   - Missing persons tracing
   - Background checks (personal, professional, tenant)
   - Surveillance operations
   - Cheating partner investigations
   - Child custody investigations

2. CORPORATE INVESTIGATIONS
   - Employee background verification
   - Corporate fraud detection
   - Business partner due diligence
   - Intellectual property theft investigation
   - Asset tracing and recovery

3. FORENSIC LABORATORY SERVICES
   - DNA testing (paternity, maternity, relationship testing)
   - Handwriting and signature analysis
   - Fingerprint examination
   - Digital forensics (phone, computer, data recovery)
   - Drug and toxicology testing
   - Document authentication and forgery detection

4. LEGAL SUPPORT SERVICES
   - Evidence gathering and documentation
   - Witness location and statements
   - Court-admissible investigation reports
   - Expert witness testimony

IMPORTANT POLICIES:
- All cases are handled with strict confidentiality — client identity is never revealed
- Free initial consultation available
- Available 24/7 for urgent cases
- We serve both individual and corporate clients across India
- Fees vary by case complexity — always recommend a free consultation for accurate quote
- Do NOT mention specific phone numbers or addresses — say "contact us directly for our current contact details"
- Always be empathetic — many clients are going through difficult situations

When a client asks about a problem (e.g. suspicious spouse, fraud, missing person), first empathize, then explain which service can help them, and invite them for a free confidential consultation.`;

let history = [];

async function callAPI(userMsg) {
  history.push({ role: "user", content: userMsg });
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY,
      "anthropic-version": "2023-06-01"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: SYSTEM,
      messages: history
    })
  });
  const data = await res.json();
  const reply = (data.content || []).map(b => b.text || "").join("") || "I'm sorry, I couldn't process that. Please try again.";
  history.push({ role: "assistant", content: reply });
  return reply;
}

function appendMsg(text, role) {
  const msgs = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  if (role === "bot") {
    const av = document.createElement("div");
    av.className = "bot-avatar";
    av.innerHTML = '<i class="ti ti-shield-search"></i>';
    wrap.appendChild(av);
  }
  const bub = document.createElement("div");
  bub.className = "bubble";
  bub.innerHTML = text.replace(/\n/g, "<br>").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  wrap.appendChild(bub);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = "msg bot"; wrap.id = "typing-indicator";
  const av = document.createElement("div");
  av.className = "bot-avatar";
  av.innerHTML = '<i class="ti ti-shield-search"></i>';
  wrap.appendChild(av);
  const bub = document.createElement("div");
  bub.className = "bubble typing";
  bub.innerHTML = "<span></span><span></span><span></span>";
  wrap.appendChild(bub);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById("typing-indicator");
  if (t) t.remove();
}

async function sendMsg() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  appendMsg(text, "user");
  showTyping();
  try {
    const reply = await callAPI(text);
    removeTyping();
    appendMsg(reply, "bot");
  } catch(e) {
    removeTyping();
    appendMsg("Sorry, something went wrong. Please try again.", "bot");
  }
}

function sendQ(q) {
  document.getElementById("chat-input").value = q;
  sendMsg();
}
</script>
</body>
</html>
